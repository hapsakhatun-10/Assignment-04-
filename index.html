<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOB APPLICATION TRACKER</title>
    <!-- daisy ui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- tailwind css -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet">

    <style>
        .btn.btn-active {
            background-color: #3b82f6 !important;
            /* Tailwind blue-500 */
            color: white !important;
            border-color: #3b82f6 !important;
        }
    </style>

</head>

<body id="main" class="mx-auto py-[74px] px-[250px] bg-[#F8FAFC]">

    <!-- Tracker section -->
    <section>
        <p class="text-[#002C5C] text-[48px] font-bold text ">Job Application Tracker</p>
        <div class="grid grid-cols-3 gap-[22px]">

            <div class=" py-[22px] px-[22px] rounded shadow ">
                <p class="text-[18px] ">Total</p>
                <h2 id="total" class="text-[28px] font-bold text-[#063c91]">0</h2>
            </div>

            <div class=" py-[22px] px-[22px] rounded shadow ">
                <p class="text-[18px]">Interview</p>
                <h2 id="interview" class="text-[28px] text-[#10B981] font-bold">0</h2>
            </div>

            <div class=" py-[22px] px-[22px] rounded shadow ">
                <p class="text-[18px]">Rejected</p>
                <h2 id="rejected" class="text-[28px] text-[#EF4444] font-bold">0</h2>
            </div>
        </div>
    </section>


    <div class="h-0.5 w-full mt-9 bg-[#E6E7E9] my-4"></div>



    <!-- JOB title section -->
    <main class="gap-3">

        <div class="grid grid-cols-2 mt-7 mb-3 ">
            <p class="text-[#002C5C] text-[28px] font-bold text mb-2 ">Available Jobs</p>
            <p class="text-[#64748B] mr-4 text-right text-[22px] font-medium" id="job-count"></p>
        </div>
        <!-- job add -->

        <div class="mb-4">
            <button onclick="toggleStyle('all-btn')" id="all-btn" class=" btn py-4 px-6 tab-btn">
                All
            </button>

            <button onclick="toggleStyle('interview-btn')" id="interview-btn" class="btn py-4 px-6 tab-btn">
                Interview
            </button>

            <button onclick="toggleStyle('rejected-btn')" id="rejected-btn" class="btn py-4 px-6 tab-btn">
                Rejected
            </button>
        </div>

        <!-- JOBS CONTAINER -->
        <div id="cart-container" class=" grid gap-7"></div>


    </main>

    <script src="script.js"></script>


</body>

</html>
