<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOB APPLICATION TRACKER</title>
    <!-- daisy ui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- tailwind css -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet">

    <style>
        .btn.btn-active {
            background-color: #3b82f6 !important;
            /* Tailwind blue-500 */
            color: white !important;
            border-color: #3b82f6 !important;
        }
    </style>

</head>

<body class="bg-[#F8FAFC] py-[20px] px-[50px]">

    <!-- Main container -->
    <div class="py-6 px-4 md:px-20">

        <!-- Tracker section -->
        <section class="mb-6">
            <p class="text-[#002C5C] text-[36px] sm:text-[48px] font-bold mb-6">Job Application Tracker</p>
            <div class="flex flex-col md:flex-row gap-4">
                <div class="py-4 px-4 rounded shadow bg-white flex-1 text-center md:text-left">
                    <p class="text-[18px]">Total</p>
                    <h2 id="total" class="text-[22px] sm:text-[28px] font-bold text-[#063c91]">0</h2>
                </div>
                <div class="py-4 px-4 rounded shadow bg-white flex-1 text-center md:text-left">
                    <p class="text-[18px]">Interview</p>
                    <h2 id="interview" class="text-[22px] sm:text-[28px] text-[#10B981] font-bold">0</h2>
                </div>
                <div class="py-4 px-4 rounded shadow bg-white flex-1 text-center md:text-left">
                    <p class="text-[18px]">Rejected</p>
                    <h2 id="rejected" class="text-[22px] sm:text-[28px] text-[#EF4444] font-bold">0</h2>
                </div>
            </div>
        </section>

        <div class="h-0.5 w-full bg-[#E6E7E9] mb-6"></div>

        <!-- JOB title and filter buttons -->
        <main class="w-full">
            <div class="flex flex-col mb-4">
                <!-- Title -->
                <div class="flex justify-between items-center mb-2">
                    <p class="text-[#002C5C] text-[24px] sm:text-[28px] font-bold">Available Jobs</p>
                    <p class="text-[#64748B] text-[18px] sm:text-[22px] font-medium" id="job-count"></p>
                </div>

                <!-- Filter Buttons (always horizontal, aligned left) -->
                <div class="flex flex-row gap-2 mt-2">
                    <button onclick="toggleStyle('all-btn')" id="all-btn"
                        class="tab-btn btn py-3 px-4 bg-slate-950 text-black w-auto">All</button>
                    <button onclick="toggleStyle('interview-btn')" id="interview-btn"
                        class="tab-btn btn py-3 px-4 border-green-600 text-green-600 w-auto">Interview</button>
                    <button onclick="toggleStyle('rejected-btn')" id="rejected-btn"
                        class="tab-btn btn py-3 px-4 border-red-600 text-red-600 w-auto">Rejected</button>
                </div>
            </div>

            <!-- JOBS CONTAINER -->
            <div id="cart-container" class="grid grid-cols-1 gap-4"></div>
        </main>

    </div>

    <script src="script.js"></script>
</body>



</html>
